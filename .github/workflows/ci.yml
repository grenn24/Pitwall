name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types across main, preload and renderer. The one check that catches the
      # class of mistake this project keeps making: a shape changed in one
      # process and not the other.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
